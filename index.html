<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Triangle Area</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; }
    .subtitle { color: #6b7280; margin-top: 0.25rem; }
    main { max-width: 900px; margin: 0 auto; }
    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .level-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
      padding: 1rem;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .level-btn:hover { border-color: #4a6cf7; transform: translateY(-2px); }
    .level-btn.active {
      border-color: #4a6cf7;
      background: #eef2ff;
      box-shadow: 0 4px 14px rgba(74,108,247,0.18);
    }
    .level-btn .badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: #4a6cf7;
      background: #eef2ff;
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
    }
    .level-btn strong { font-size: 0.95rem; }
    .level-btn small { color: #6b7280; font-size: 0.75rem; }
    .task {
      background: white;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
    }
    .task-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 2rem;
    }
    .task-header { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #4a6cf7;
    }
    .tag-alt { background: #fef3c7; color: #92400e; }
    .problem {
      font-size: 1.05rem;
      line-height: 1.65;
      padding: 1rem 1.25rem;
      background: #f8f9ff;
      border-left: 4px solid #4a6cf7;
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }
    .formula {
      font-family: Georgia, serif;
      font-style: italic;
      color: #4a6cf7;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .answer-input {
      margin: 1.25rem 0;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px dashed #e5e7eb;
    }
    .answer-input label { font-weight: 600; font-size: 0.9rem; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }
    .input-row input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    .input-row input:focus { border-color: #4a6cf7; }
    .unit { color: #6b7280; font-size: 0.9rem; }
    .input-row button {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 10px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .input-row button:hover { background: #3a5ce0; }
    .feedback { margin-top: 0.6rem; font-size: 0.9rem; font-weight: 500; min-height: 1.2rem; }
    .feedback.ok { color: #10b981; }
    .feedback.err { color: #ef4444; }
    .feedback.warn { color: #f59e0b; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .btn-primary, .btn-secondary {
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-primary { background: #4a6cf7; color: white; }
    .btn-primary:hover { background: #3a5ce0; }
    .btn-secondary { background: #eef2ff; color: #4a6cf7; }
    .btn-secondary:hover { background: #dde5ff; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .hints, .solution {
      margin-top: 0.75rem;
      padding-left: 1.5rem;
      line-height: 1.8;
      font-size: 0.95rem;
    }
    .hints li { color: #b45309; }
    .solution li { color: #047857; }
    .final-answer {
      margin-top: 1rem;
      padding: 0.9rem 1.1rem;
      background: #ecfdf5;
      border-radius: 10px;
      font-weight: 700;
      color: #065f46;
      border-left: 4px solid #10b981;
    }
    .visualization {
      background: #f8f9ff;
      border-radius: 14px;
      padding: 1rem;
    }
    .visualization h3 {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    #triangleSvg {
      width: 100%;
      height: auto;
      background: white;
      border-radius: 10px;
    }
    .history {
      background: white;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .history h3 { font-size: 1rem; margin-bottom: 0.75rem; }
    #historyList { list-style: none; }
    #historyList li {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
      gap: 1rem;
      color: #6b7280;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e7ff;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .task-grid { grid-template-columns: 1fr; }
      .levels { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>📐 AI Triangle Area</h1>
    <p class="subtitle">Differentiated learning: 4 levels of difficulty</p>
  </header>

  <main>
    <section class="levels">
      <button class="level-btn active" data-level="1">
        <span class="badge">L1</span>
        <strong>Foundation</strong>
        <small>½ · a · h</small>
      </button>
      <button class="level-btn" data-level="2">
        <span class="badge">L2</span>
        <strong>Standard</strong>
        <small>½ · a · h</small>
      </button>
      <button class="level-btn" data-level="3">
        <span class="badge">L3</span>
        <strong>Advanced</strong>
        <small>Heron's formula</small>
      </button>
      <button class="level-btn" data-level="4">
        <span class="badge">L4</span>
        <strong>Expert</strong>
        <small>Coordinates</small>
      </button>
    </section>

    <section id="loading" class="loading">
      <div class="spinner"></div>
      <p>AI is generating a task…</p>
    </section>

    <section id="task" class="task hidden">
      <div class="task-grid">
        <div class="task-content">
          <div class="task-header">
            <span id="levelTag" class="tag">Level 1</span>
            <span id="methodTag" class="tag tag-alt"></span>
          </div>

          <p id="problem" class="problem"></p>
          <p id="formula" class="formula"></p>

          <div class="answer-input">
            <label for="userAnswer">Your answer:</label>
            <div class="input-row">
              <input type="text" id="userAnswer" placeholder="e.g., 30" autocomplete="off">
              <span id="unitLabel" class="unit">cm²</span>
              <button id="checkBtn">Check</button>
            </div>
            <p id="feedback" class="feedback"></p>
          </div>

          <div class="actions">
            <button id="hintBtn" class="btn-secondary">💡 Hint</button>
            <button id="solveBtn" class="btn-secondary">✅ Solution</button>
            <button id="newBtn" class="btn-primary">🔄 New task</button>
          </div>

          <ul id="hints" class="hints hidden"></ul>
          <ol id="solution" class="solution hidden"></ol>
          <p id="answer" class="final-answer hidden"></p>
        </div>

        <div class="visualization">
          <h3>Visualization</h3>
          <svg id="triangleSvg" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </section>

    <section class="history">
      <h3>🕘 Recent tasks</h3>
      <ul id="historyList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
